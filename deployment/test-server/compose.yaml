name: rc-chatwoot-test

x-app: &app
  image: ${CHATWOOT_IMAGE_REPOSITORY:-rc-chatwoot}:${CHATWOOT_IMAGE_TAG:?Set CHATWOOT_IMAGE_TAG}
  env_file: .env
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
  volumes:
    - storage_data:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_started
  restart: unless-stopped
  logging:
    driver: local

services:
  rails:
    <<: *app
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, rails, s, -p, '3000', -b, 0.0.0.0]

  sidekiq:
    <<: *app
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:?Set POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME:?Set POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: local

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: local

  mailpit:
    image: axllent/mailpit:v1
    ports:
      - '127.0.0.1:8025:8025'
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    restart: unless-stopped
    logging:
      driver: local

  caddy:
    image: caddy:2-alpine
    environment:
      CHATWOOT_DOMAIN: ${CHATWOOT_DOMAIN:?Set CHATWOOT_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
      - '127.0.0.1:8080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rails
    restart: unless-stopped
    logging:
      driver: local

volumes:
  storage_data:
  postgres_data:
  redis_data:
  mailpit_data:
  caddy_data:
  caddy_config:
