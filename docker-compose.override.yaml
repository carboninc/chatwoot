services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
  rails:
    environment:
      CW_EDITION: ce
      VITE_RUBY_HOST: vite
  sidekiq:
    environment:
      CW_EDITION: ce
  vite:
    environment:
      VITE_RUBY_HOST: 0.0.0.0
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: vite
